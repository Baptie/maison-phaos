# Déploiement automatique de la PROD chez OVH (hébergement mutualisé, par FTP).
#  - à chaque push sur la branche « main » ;
#  - toutes les 3 heures, pour relire les articles Sanity (le site est statique) ;
#  - à la demande (onglet Actions > « Déployer la prod » > Run workflow) ;
#  - sur demande externe « sanity-publish » (webhook Sanity, facultatif : voir README).
# Google Agenda n'est pas encore branché : l'agenda affiche « arrive bientôt ».
# Secrets à créer : voir README, section « Déploiement automatique ».
name: Déployer la prod

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Un seul déploiement de prod à la fois ; un nouveau remplace celui en attente
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire le site (prod)
        run: npm run build:prod
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          # À ajouter plus tard : GOOGLE_CALENDAR_ICS_URL
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL_PROD }}

      - name: Vérifier le build avant d'envoyer
        run: test -s dist-prod/index.html && test -s dist-prod/.htaccess

      - name: Envoyer sur OVH (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_HOST }}
          username: ${{ secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          # ftps (chiffré) par défaut ; si le serveur le refuse (« security scheme is not implemented »),
          # créer le secret OVH_FTP_PROTOCOL avec la valeur « ftp »
          protocol: ${{ secrets.OVH_FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist-prod/
          server-dir: ${{ secrets.OVH_PROD_DIR }}
