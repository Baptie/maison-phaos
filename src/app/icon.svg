<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="Maison Phaos">
  <title>Maison Phaos (logo provisoire)</title>
  <!-- Fond bleu marine carré -->
  <rect width="100" height="100" rx="6" fill="#0B2551"/>
  <!-- Toit rouge en accent circonflexe, fin, au-dessus de la croix -->
  <path d="M28 20 L50 8 L72 20" fill="none" stroke="#EF4135" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Croix de soin blanche, centrée (centre 50,50), proportions de la maquette -->
  <rect x="40.5" y="24.8" width="19" height="50.4" fill="#FFFFFF"/>
  <rect x="24.8" y="40.6" width="50.4" height="19" fill="#FFFFFF"/>
</svg>
